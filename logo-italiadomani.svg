<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <!-- Italian Republic Star Emblem -->
  <g transform="translate(12, 10)">
    <!-- Cogwheel -->
    <circle cx="30" cy="30" r="24" fill="none" stroke="#003366" stroke-width="4" stroke-dasharray="8 4"/>
    <!-- Olive & Oak leaves subtle branches -->
    <path d="M14,46 C10,38 12,24 20,16 C16,24 16,36 22,44 Z" fill="#009246" opacity="0.85"/>
    <path d="M46,46 C50,38 48,24 40,16 C44,24 44,36 38,44 Z" fill="#009246" opacity="0.85"/>
    <!-- Star -->
    <polygon points="30,12 34.5,23.5 47,24 37.5,31.5 40.5,43.5 30,36.5 19.5,43.5 22.5,31.5 13,24 25.5,23.5" fill="#003366"/>
  </g>

  <!-- Italiadomani Logo Typography -->
  <g transform="translate(85, 25)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Brand wordmark Italiadomani with tricolore accent -->
    <text x="0" y="20" font-size="24" font-weight="900" fill="#003366" letter-spacing="-0.8">Italia<tspan fill="#009246">do</tspan><tspan fill="#003366">ma</tspan><tspan fill="#CE2B37">ni</tspan></text>
    
    <!-- Subtitle: PIANO NAZIONALE DI RIPRESA E RESILIENZA -->
    <text x="1" y="36" font-size="8.5" font-weight="800" fill="#003366" letter-spacing="0.8">PIANO NAZIONALE</text>
    <text x="1" y="47" font-size="8.5" font-weight="800" fill="#003366" letter-spacing="0.8">DI RIPRESA E RESILIENZA</text>
  </g>
</svg>
