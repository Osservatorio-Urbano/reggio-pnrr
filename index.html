<!DOCTYPE html>
<html lang="it" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <title>RADAR PNRR · Data Platform by U.D.P. Unità Speciale per il PNRR</title>
  <meta name="description" content="Osservatorio territoriale del PNRR del Comune di Reggio Emilia: Risorse, Progetti, Cantieri e Territorio. Data Platform by U.D.P. Unità Speciale per il PNRR." />
  <meta name="theme-color" content="#0E8C9B" />
  <meta name="color-scheme" content="light" />

  <!-- Preconnect to CARTO CDN -->
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" />
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" />
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" />
  <link rel="preconnect" href="https://d.basemaps.cartocdn.com" />

  <!-- Google Fonts: Plus Jakarta Sans & Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./favicon-DcNhgrbC.png" />
  <link rel="apple-touch-icon" href="./favicon-DcNhgrbC.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="RADAR PNRR · Data Platform by U.D.P. Unità Speciale per il PNRR" />
  <meta property="og:description" content="Urban Investment Control Room del Comune di Reggio Emilia: mappa interattiva degli investimenti, opere pubbliche e cantieri PNRR." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="it_IT" />
  <script type="module" crossorigin src="./assets/index-CfxUOCMs.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CnY3_XFj.css">
</head>

<body class="min-h-full flex flex-col bg-surface-subtle text-ink select-none md:select-auto">
  
  <!-- Main Application Wrapper -->
  <div class="relative h-dvh w-full overflow-hidden">
    
    <!-- 1. CARTO Interactive Map Canvas -->
    <div id="map-container" class="absolute inset-0 z-0"></div>

    <!-- 2. TOP UNIFIED NAVIGATION & SEARCH ROW (Never overlaps: flex row with right margin for sidebar) -->
    <div 
      id="top-nav-bar" 
      class="absolute top-2 left-2 right-14 md:top-3 md:left-4 md:right-[456px] z-40 flex items-center justify-between gap-2.5 pointer-events-none transition-all duration-300"
    >
      <!-- Header Pill: Brand + Logos + Action Buttons -->
      <header class="pointer-events-auto flex h-11 md:h-12 items-center gap-1.5 md:gap-2 rounded-full bg-white/95 backdrop-blur-md pl-4 pr-3.5 md:pl-5 md:pr-4 shadow-card border border-ink/8 shrink-0">
        <!-- Brand Link: Comune Logo + Separator | + Title & Subtitle -->
        <a href="./" class="flex items-center shrink-0 outline-none focus-visible:ring-2 focus-visible:ring-teal rounded-xl py-0.5 group select-none" aria-label="Comune di Reggio Emilia · RADAR PNRR">
          <!-- Comune di Reggio Emilia Official Logo -->
          <div class="flex items-center shrink-0 pr-1">
            <img 
              src="./reggio-emilia.png" 
              alt="Comune di Reggio Emilia" 
              class="h-6 md:h-7 w-auto object-contain select-none"
              title="Comune di Reggio Emilia"
            />
          </div>

          <!-- Separator 1: Between Logos -->
          <span aria-hidden="true" class="h-5 md:h-5.5 w-[1px] shrink-0 bg-ink/15 mx-1.5 md:mx-2"></span>

          <!-- NextGenerationEU Official Logo -->
          <div class="flex items-center shrink-0 pr-1">
            <img 
              src="./images.png" 
              alt="Finanziato dall'Unione europea - NextGenerationEU" 
              class="h-5 md:h-6.5 w-auto object-contain select-none"
              title="Finanziato dall'Unione europea - NextGenerationEU"
            />
          </div>

          <!-- Separator 2: Between Logos and Title -->
          <span aria-hidden="true" class="h-5 md:h-5.5 w-[1px] shrink-0 bg-ink/15 mx-1.5 md:mx-2"></span>

          <!-- Title & Subtitle -->
          <div class="flex flex-col justify-center leading-none pr-1">
            <div class="flex items-center gap-1.5">
              <span class="font-black text-[13px] md:text-[14.5px] tracking-tight text-ink leading-tight group-hover:text-teal transition-colors">
                <span class="text-teal font-black">RADAR</span> PNRR
              </span>
            </div>
            <span class="text-[7.5px] md:text-[8px] font-bold tracking-wider text-ink-muted uppercase leading-none mt-0.5 whitespace-nowrap">
              data platform by U.D.P. UNITÀ SPECIALE PER IL PNRR
            </span>
          </div>
        </a>

        <!-- Separator 2: Between Brand (Logo+Title+NextGenEU) and Action Buttons -->
        <span aria-hidden="true" class="h-4.5 w-[1px] shrink-0 bg-ink/15 mx-1 md:mx-1.5"></span>

        <!-- Action Button 1: "LA CITTÀ CHE CAMBIA" (Modalità Narrativa) -->
        <button 
          type="button" 
          id="city-change-btn" 
          class="flex h-7 md:h-7.5 items-center gap-1 px-2.5 md:px-3 rounded-full bg-teal-soft text-teal hover:bg-teal hover:text-white font-extrabold text-[10.5px] md:text-[11px] transition-all active:scale-95 shadow-xs"
          title="Modalità La Città che Cambia: storytelling dei 7 pilastri urbani"
        >
          <i class="ph-bold ph-sparkle text-xs"></i>
          <span class="hidden sm:inline">La Città che Cambia</span>
        </button>

        <!-- Action Button 2: "ANALISI" (Dashboard Overlay) -->
        <button 
          type="button" 
          id="analytics-btn" 
          class="flex h-7 md:h-7.5 items-center gap-1 px-2.5 md:px-3 rounded-full bg-ink/5 text-ink/80 hover:bg-teal-soft hover:text-teal font-extrabold text-[10.5px] md:text-[11px] transition-all active:scale-95"
          title="Apri Dashboard Analisi con grafici e metriche di portafoglio"
        >
          <i class="ph-bold ph-chart-donut text-xs"></i>
          <span class="hidden sm:inline">Analisi</span>
        </button>

        <!-- Info & Data Sources Button -->
        <button 
          type="button" 
          id="info-modal-btn" 
          class="flex h-7 md:h-7.5 items-center gap-1.5 px-2.5 md:px-3 rounded-full bg-ink/5 text-ink/80 hover:bg-teal-soft hover:text-teal font-extrabold text-[10.5px] md:text-[11px] transition-all active:scale-95"
          title="Fonti dei dati, date di ultimo aggiornamento e trasparenza PNRR"
          aria-label="Fonti Dati e Trasparenza"
        >
          <i class="ph-bold ph-database text-xs text-teal"></i>
          <span class="hidden md:inline">Fonti & Dati</span>
        </button>

        <!-- Separator 4: Between Action Buttons and User Profile -->
        <span aria-hidden="true" class="h-4.5 w-[1px] shrink-0 bg-ink/15 mx-1 md:mx-1.5"></span>

        <!-- Authenticated User Profile Pill & Logout Button -->
        <div id="auth-user-pill" class="flex items-center gap-1.5 pl-0.5">
          <div 
            class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-100 border border-slate-200 text-slate-700 text-[11px] font-bold select-none cursor-default" 
            title="Dott.ssa Francesca Mattioli · Direzione Generale & Controllo di Gestione"
          >
            <div class="h-5 w-5 rounded-full bg-teal text-white flex items-center justify-center text-[9px] font-black shrink-0">
              FM
            </div>
            <span id="auth-user-name" class="hidden lg:inline text-[10.5px] font-extrabold text-ink">Dott.ssa F. Mattioli</span>
          </div>

          <!-- Logout Button -->
          <button 
            type="button" 
            id="auth-logout-btn" 
            class="flex h-7 md:h-7.5 items-center gap-1 px-2.5 rounded-full bg-rose-50 text-rose-700 hover:bg-rose-600 hover:text-white border border-rose-200 text-[10.5px] font-black transition-all active:scale-95"
            title="Esci dalla sessione protetta"
            aria-label="Disconnetti"
          >
            <i class="ph-bold ph-sign-out text-xs"></i>
            <span class="hidden sm:inline">Esci</span>
          </button>
        </div>
      </header>

      <!-- Search Bar Container (In Flex Row, auto-sized, never overlaps header!) -->
      <div 
        id="search-bar-container" 
        class="pointer-events-auto flex-1 max-w-[280px] sm:max-w-[340px] lg:max-w-[380px] min-w-[140px]"
      ></div>
    </div>

    <!-- 3. MAP CONTROLS DECK (Vertically stacked flex column, left-aligned) -->
    <div 
      id="map-controls-deck" 
      class="absolute top-[52px] md:top-[60px] left-2 right-2 md:left-4 md:right-[456px] z-30 pointer-events-none flex flex-col items-start gap-1.5 transition-all duration-300"
    >
      <!-- Row A: Type Filter Bar (Tutti, Opere & Cantieri, Digitale & Servizi) -->
      <div 
        id="scope-selector-container" 
        class="pointer-events-auto flex items-center gap-1.5 rounded-full bg-white/95 backdrop-blur-md p-1 shadow-card border border-ink/8 select-none"
      >
        <div class="flex items-center gap-1 px-1 text-[10px] font-black uppercase text-teal tracking-wide">
          <i class="ph-bold ph-faders"></i>
          <span>Tipologia:</span>
        </div>

        <!-- Type Switch: [ TUTTI ] [ OPERE & CANTIERI ] [ DIGITALE & SERVIZI ] -->
        <div class="flex items-center gap-0.5 text-[10.5px] md:text-[11px] font-bold">
          <button 
            type="button" 
            class="type-pill-btn px-2.5 py-0.5 md:py-1 rounded-full transition-all bg-teal text-white shadow-xs font-black"
            data-type="tutti"
          >
            Tutti i progetti
          </button>
          <button 
            type="button" 
            class="type-pill-btn px-2.5 py-0.5 md:py-1 rounded-full transition-all text-ink/70 hover:text-ink font-bold"
            data-type="opere"
            title="Opere pubbliche e cantieri fisici del Comune di Reggio Emilia"
          >
            Opere & Cantieri
          </button>
          <button 
            type="button" 
            class="type-pill-btn px-2.5 py-0.5 md:py-1 rounded-full transition-all text-ink/70 hover:text-ink font-bold"
            data-type="digitale_servizi"
            title="Interventi immateriali, digitalizzazione e servizi comunali"
          >
            Digitale & Servizi
          </button>
        </div>
      </div>

      <!-- Row B: Active Filter Chips Bar (Shown only when filters are active) -->
      <div 
        id="active-filter-chips-container" 
        class="hidden pointer-events-auto max-w-full"
      ></div>

      <!-- Row C: Urban Investment KPI Bar -->
      <div 
        id="kpi-bar-container" 
        class="pointer-events-auto max-w-full"
      ></div>

      <!-- Row D: Left Sidebar / Legenda "Investimenti & Territorio" (Top-Left under KPI Bar) -->
      <div 
        id="legend-container" 
        class="pointer-events-auto mt-0.5"
      ></div>

      <!-- Row D: Floating Active Ambito / Quartiere Banner (Compatibility fallback) -->
      <div 
        id="active-ambito-pill" 
        class="hidden pointer-events-auto transition-all duration-300"
      >
        <div class="flex items-center gap-2 px-3.5 py-1 rounded-full bg-white/98 backdrop-blur-md shadow-float border border-teal text-ink text-xs font-bold">
          <span class="flex h-2 w-2 relative">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-teal"></span>
          </span>
          <span>Filtro Territoriale: <strong id="active-ambito-name" class="text-teal font-black">Ambito A</strong></span>
          <button 
            type="button" 
            id="active-ambito-reset-btn" 
            class="ml-1.5 flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-teal text-white hover:bg-teal-dark text-[11px] font-extrabold transition-all active:scale-95 shadow-sm"
            title="Mostra tutta la città"
          >
            <i class="ph-bold ph-x text-[10px]"></i>
            <span>Tutta la città</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 6. Floating Map Action Buttons (Right: Center on RE, Locate Me) -->
    <div class="absolute right-3 bottom-[calc(var(--sheet-collapsed)+16px)] md:right-4 md:top-4 md:bottom-auto z-30 flex flex-col gap-2 transition-all duration-300">
      <div class="flex flex-col gap-1 rounded-full bg-white/95 backdrop-blur-md p-1.5 shadow-card border border-ink/8">
        <!-- Fit Bounds / Center on Reggio Emilia -->
        <button 
          type="button" 
          id="fit-bounds-btn" 
          class="flex h-10 w-10 md:h-11 md:w-11 items-center justify-center rounded-full text-ink hover:bg-teal-soft hover:text-teal transition-all active:scale-95"
          title="Centra la mappa sul Comune di Reggio Emilia"
          aria-label="Centra mappa"
        >
          <i class="ph-bold ph-arrows-out-cardinal text-lg"></i>
        </button>

        <!-- Geolocation Button -->
        <button 
          type="button" 
          id="locate-me-btn" 
          class="flex h-10 w-10 md:h-11 md:w-11 items-center justify-center rounded-full text-ink hover:bg-teal-soft hover:text-teal transition-all active:scale-95"
          title="Trova la mia posizione a Reggio Emilia"
          aria-label="Trova la mia posizione"
        >
          <i class="ph-bold ph-crosshair text-lg"></i>
        </button>
      </div>
    </div>

    <!-- 7. Floating Data Source & Update Badge (Bottom-Left) -->
    <div 
      id="sources-badge-container" 
      class="absolute left-3 bottom-[calc(var(--sheet-collapsed)+12px)] md:left-4 md:bottom-3.5 z-30 pointer-events-auto select-none"
    >
      <button 
        type="button" 
        id="sources-info-trigger-btn" 
        class="group flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/95 backdrop-blur-md shadow-card border border-ink/8 text-ink hover:border-teal/30 hover:bg-teal-soft/60 transition-all text-left active:scale-95"
        title="Clicca per visualizzare il dettaglio di tutte le fonti dati e delle date di aggiornamento"
      >
        <span class="flex h-2 w-2 relative shrink-0">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <div class="flex items-center gap-1.5 text-[10.5px] leading-tight">
          <span class="font-extrabold text-teal">Fonti:</span>
          <span class="text-ink/80 font-bold hidden sm:inline">Open Data PNRR (MEF) · OpenPNRR · Comune RE</span>
          <span class="text-ink/80 font-bold sm:hidden">MEF · OpenPNRR · Comune RE</span>
          <span class="text-ink/30 font-light">|</span>
          <span class="font-bold text-ink/70">Ultimo aggiornamento: <strong class="text-ink font-black">Febbraio – Giugno 2026</strong></span>
        </div>
        <i class="ph-bold ph-arrow-up-right text-xs text-ink/40 group-hover:text-teal transition-colors shrink-0"></i>
      </button>
    </div>

    <!-- 8. Expand Desktop Sidebar Floating Button (shown when right sidebar is collapsed) -->
    <button 
      type="button" 
      id="expand-sidebar-btn" 
      class="hidden absolute right-4 top-[84px] z-30 flex h-11 items-center gap-2 rounded-full bg-white/95 backdrop-blur-md px-4 shadow-float border border-ink/8 text-ink font-bold text-sm hover:bg-teal-soft hover:text-teal transition-all"
    >
      <i class="ph-bold ph-sidebar-simple text-lg text-teal"></i>
      <span id="filter-counter-badge">Progetti PNRR</span>
    </button>

    <!-- 9. Desktop Floating Sidebar Panel (Right side: "Progetti PNRR") -->
    <aside 
      id="desktop-sidebar-panel" 
      class="hidden md:flex absolute bottom-4 top-[84px] right-4 z-30 w-[420px] lg:w-[440px] flex-col rounded-panel bg-white/98 backdrop-blur-md shadow-float border border-ink/8 transition-transform duration-300 ease-out"
    >
      <!-- Mounted by RightSidebar -->
    </aside>

    <!-- 10. Mobile Bottom Sheet (Mobile Viewport) -->
    <div 
      id="mobile-bottom-sheet" 
      class="bottom-sheet absolute inset-x-0 bottom-0 z-30 flex flex-col rounded-t-panel bg-white shadow-sheet border-t border-ink/8 md:hidden"
      style="height: calc(100dvh - 100px);"
    >
      <!-- Drag Handle & Peek Header -->
      <div 
        id="mobile-sheet-handle" 
        role="button" 
        tabindex="0" 
        aria-expanded="false" 
        class="flex shrink-0 select-none flex-col items-center justify-center gap-1.5 px-4 cursor-pointer"
        style="height: var(--sheet-collapsed);"
      >
        <span aria-hidden="true" class="h-1.5 w-12 rounded-full bg-ink/20"></span>
        <span id="mobile-projects-count" class="text-[14px] font-black text-ink">Progetti PNRR</span>
        <span class="text-[10px] font-bold text-teal uppercase tracking-wide">Tocca o trascina per esplorare</span>
      </div>

      <!-- Scrollable Projects List -->
      <div class="flex-1 overflow-y-auto overscroll-contain p-3 custom-scrollbar">
        <div id="mobile-projects-list" class="flex flex-col gap-2.5 pb-8"></div>
      </div>
    </div>

    <!-- 11. Overlays & Modals Containers -->
    <div id="login-modal-container" class="hidden"></div>
    <div id="detail-modal-container" class="hidden"></div>
    <div id="info-modal-container" class="hidden"></div>
    <div id="analytics-modal-container" class="hidden"></div>
    <div id="citychange-modal-container" class="hidden"></div>

  </div>

  <!-- Vite entry script -->
</body>
</html>
